<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Alpha Edge Verification Test</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: sans-serif;
      background: #e0e0e0;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }
    .test-card {
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .cream-bg {
      background-color: #FFF8F3;
      color: #5B2A4E;
    }
    .plum-bg {
      background-color: #5B2A4E;
      color: #FFF8F3;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo-container {
      width: 320px;
      max-width: 90%;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(91,42,78,0.25));
    }
  </style>
</head>
<body>
  <!-- Test on #FFF8F3 (Cream) -->
  <div class="test-card cream-bg">
    <h2>Tested on #FFF8F3 (Cream Background)</h2>
    <div class="logo-container">
      <picture>
        <source srcset="/images/optimized/logo_ar.webp" type="image/webp">
        <img src="/images/optimized/logo_ar.png" alt="AR Logo on Cream">
      </picture>
    </div>
  </div>

  <!-- Test on #5B2A4E (Plum) -->
  <div class="test-card plum-bg">
    <h2>Tested on #5B2A4E (Plum Background)</h2>
    <div class="logo-container">
      <picture>
        <source srcset="/images/optimized/logo_ar.webp" type="image/webp">
        <img src="/images/optimized/logo_ar.png" alt="AR Logo on Plum">
      </picture>
    </div>
  </div>
</body>
</html>
